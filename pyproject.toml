[project]
name = "naminal-hub"
version = "0.1.0"
description = "Local-first, rights-aware animal video production for Naminal Hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.1", "pillow>=10.4.0"]

[project.optional-dependencies]
tts = ["mlx-audio>=0.2.0", "misaki[en]>=0.9.4"]
dev = ["pytest>=8.3.0"]

[project.scripts]
naminal = "animal_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
